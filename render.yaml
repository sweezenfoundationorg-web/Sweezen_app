# ========================================================
# RENDER BLUEPRINT CONFIGURATION (render.yaml)
# Sweezen Foundation Node.js Express API & PostgreSQL Database
# ========================================================

services:
  - type: web
    name: sweezen-backend-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sweezen-postgres-db
          property: connectionString
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false

databases:
  - name: sweezen-postgres-db
    databaseName: sweezen_db
    user: sweezen_admin
    plan: free
    region: singapore
